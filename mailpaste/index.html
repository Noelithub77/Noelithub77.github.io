<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MailPaste</title>
  <style>
    :root{--bg:#090909;--panel:#101010;--panel2:#141414;--line:#262626;--line2:#363636;--text:#f4f4f2;--muted:#858585;--soft:#b8b8b3}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;padding:18px}
    .app{width:min(1500px,100%);margin:0 auto}
    header{height:54px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 3px}
    .brand{display:flex;align-items:baseline;gap:10px}.brand strong{font-size:17px;letter-spacing:-.02em}.brand span{font-size:12px;color:var(--muted)}
    .actions{display:flex;align-items:center;gap:8px}
    button{appearance:none;border:1px solid var(--line2);background:#171717;color:#d5d5d5;border-radius:9px;padding:9px 13px;font:600 13px/1 inherit;cursor:pointer;transition:.15s ease}
    button:hover{background:#202020;border-color:#4a4a4a}button:active{transform:translateY(1px)}
    button.primary{background:#f3f3ef;color:#111;border-color:#f3f3ef}button.primary:hover{background:#fff;border-color:#fff}
    .grid{display:grid;grid-template-columns:minmax(330px,.9fr) minmax(440px,1.35fr);gap:12px;height:calc(100vh - 90px);min-height:540px}
    .panel{min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
    .bar{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
    .state{display:inline-flex;align-items:center;gap:7px}.dot{width:6px;height:6px;border-radius:50%;background:#555}.dot.ready{background:#d6d6cf}
    textarea{width:100%;height:100%;min-height:0;resize:none;border:0;outline:0;background:transparent;color:#d8d8d8;padding:18px;font:12.5px/1.65 "SFMono-Regular",Consolas,"Liberation Mono",monospace;tab-size:2}
    textarea::placeholder{color:#555}
    .preview{background:#0d0d0d}.framewrap{flex:1;min-height:0;padding:12px;background:radial-gradient(circle at 50% 0,rgba(255,255,255,.025),transparent 34%),#0c0c0c}
    iframe{display:block;width:100%;height:100%;border:0;border-radius:10px;background:#fff}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#f4f4f0;color:#111;border-radius:9px;padding:10px 13px;font-size:13px;font-weight:650;box-shadow:0 12px 40px rgba(0,0,0,.4);transition:.18s ease;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:860px){body{padding:12px}header{height:auto;min-height:58px;padding:6px 2px 12px}.brand span{display:none}.grid{height:auto;min-height:0;grid-template-columns:1fr}.panel:first-child{height:42vh;min-height:330px}.preview{height:62vh;min-height:440px}button{padding:8px 10px}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><strong>MailPaste</strong><span>HTML → Gmail</span></div>
      <div class="actions"><button id="paste">Paste</button><button id="clear">Clear</button><button id="copy" class="primary">Copy</button></div>
    </header>

    <section class="grid">
      <div class="panel">
        <div class="bar"><span>HTML</span><span class="state"><span id="dot" class="dot"></span><span id="status">Empty</span></span></div>
        <textarea id="source" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Paste HTML here..."></textarea>
      </div>

      <div class="panel preview">
        <div class="bar"><span>Preview</span><span>Gmail-ready</span></div>
        <div class="framewrap"><iframe id="frame" sandbox="allow-same-origin" title="HTML preview"></iframe></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const source=document.getElementById('source');
    const frame=document.getElementById('frame');
    const copyBtn=document.getElementById('copy');
    const pasteBtn=document.getElementById('paste');
    const clearBtn=document.getElementById('clear');
    const dot=document.getElementById('dot');
    const status=document.getElementById('status');
    const toast=document.getElementById('toast');

    const PROPS=['background','background-color','background-image','background-position','background-repeat','background-size','border','border-top','border-right','border-bottom','border-left','border-collapse','border-spacing','border-radius','box-sizing','color','display','float','font','font-family','font-size','font-style','font-weight','height','letter-spacing','line-height','list-style','margin','margin-top','margin-right','margin-bottom','margin-left','max-width','min-width','opacity','padding','padding-top','padding-right','padding-bottom','padding-left','text-align','text-decoration','text-transform','vertical-align','white-space','width'];

    function note(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(note.t);note.t=setTimeout(()=>toast.classList.remove('show'),1400)}

    function render(){
      const value=source.value;
      const ready=value.trim().length>0;
      dot.classList.toggle('ready',ready);
      status.textContent=ready?'Ready':'Empty';
      frame.srcdoc=ready?value:'<!doctype html><html><body style="margin:0;background:#fff"></body></html>';
    }

    function inlineTree(srcRoot,dstRoot){
      const src=[srcRoot,...srcRoot.querySelectorAll('*')];
      const dst=[dstRoot,...dstRoot.querySelectorAll('*')];
      for(let i=0;i<src.length;i++){
        const a=src[i],b=dst[i];
        if(!a||!b||a.nodeType!==1)continue;
        const cs=frame.contentWindow.getComputedStyle(a);
        const out=[];
        for(const p of PROPS){const v=cs.getPropertyValue(p);if(v)out.push(p+':'+v)}
        if(out.length)b.setAttribute('style',out.join(';'));
        if(b.hasAttribute('href')){try{b.setAttribute('href',new URL(b.getAttribute('href'),a.baseURI).href)}catch{}}
        if(b.hasAttribute('src')){try{b.setAttribute('src',new URL(b.getAttribute('src'),a.baseURI).href)}catch{}}
      }
    }

    function clipboardPayload(){
      const doc=frame.contentDocument;
      if(!doc||!doc.body)return null;
      const clone=doc.body.cloneNode(true);
      inlineTree(doc.body,clone);
      clone.querySelectorAll('script,iframe,object,embed,form,input,button,textarea,select').forEach(el=>el.remove());
      return {html:clone.innerHTML,text:doc.body.innerText||doc.body.textContent||''};
    }

    async function copyRich(){
      const data=clipboardPayload();
      if(!data||!data.html.trim()){note('Nothing to copy');return}
      try{
        if(navigator.clipboard&&window.ClipboardItem){
          await navigator.clipboard.write([new ClipboardItem({
            'text/html':new Blob([data.html],{type:'text/html'}),
            'text/plain':new Blob([data.text],{type:'text/plain'})
          })]);
          note('Copied for Gmail');
          return;
        }
      }catch(e){console.warn(e)}

      const doc=frame.contentDocument;
      const sel=frame.contentWindow.getSelection();
      const range=doc.createRange();
      range.selectNodeContents(doc.body);sel.removeAllRanges();sel.addRange(range);
      let ok=false;try{ok=doc.execCommand('copy')}catch(e){}
      sel.removeAllRanges();note(ok?'Copied for Gmail':'Copy failed');
    }

    async function pasteHtml(){
      try{
        if(navigator.clipboard&&navigator.clipboard.read){
          const items=await navigator.clipboard.read();
          for(const item of items){
            if(item.types.includes('text/plain')){
              source.value=await (await item.getType('text/plain')).text();render();source.focus();return;
            }
          }
        }
        source.value=await navigator.clipboard.readText();render();source.focus();
      }catch(e){source.focus();note('Press Ctrl+V / ⌘V')}
    }

    source.addEventListener('input',render);
    pasteBtn.addEventListener('click',pasteHtml);
    copyBtn.addEventListener('click',copyRich);
    clearBtn.addEventListener('click',()=>{source.value='';render();source.focus()});
    source.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();copyRich()}});
    frame.addEventListener('load',()=>{status.textContent=source.value.trim()?'Ready':'Empty'});
    render();
  </script>
</body>
</html>
