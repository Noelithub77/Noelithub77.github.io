<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokémon Showdown Mobile invite</title>
    <style>
      :root { color-scheme: light; font-family: ui-rounded, "Segoe UI", sans-serif; background: #faf8ff; color: #2f2a3a; }
      body { display: grid; min-height: 100svh; margin: 0; place-items: center; padding: 1.25rem; box-sizing: border-box; }
      main { width: min(100%, 24rem); padding: 2rem; border: 1px solid #e5def2; border-radius: 1.75rem; background: #fff; box-shadow: 0 1rem 3rem rgb(74 52 107 / 10%); text-align: center; }
      h1 { margin: 0 0 .5rem; font-size: 1.4rem; }
      p { color: #6a6475; line-height: 1.5; }
      button { width: 100%; margin-top: 1rem; padding: .85rem 1rem; border: 0; border-radius: 999px; background: #8065c7; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      .name { color: #8065c7; font-weight: 700; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pokémon Showdown Mobile</h1>
      <p id="message">Opening your battle invite…</p>
      <a id="open" class="hidden"><button type="button">Open Pokémon Showdown Mobile</button></a>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search)
      const rawPlayer = params.get("player") || ""
      const player = rawPlayer.trim().replace(/^[+%@&~#*]+/, "").replace(/[^A-Za-z0-9]/g, "").slice(0, 18)
      const message = document.querySelector("#message")
      const open = document.querySelector("#open")
      if (player && player === rawPlayer) {
        message.innerHTML = `Challenge <span class="name">${player}</span> in a Generation 9 Random Battle.`
        open.href = `app.pokemonshowdown.mobile://invite?player=${encodeURIComponent(player)}`
        open.classList.remove("hidden")
      } else {
        message.textContent = "This invite is incomplete. Scan a fresh code from the app."
      }
    </script>
  </body>
</html>
